# =============================================================================
# Auto-Annotate + Roboflow Upload - Configuration
# =============================================================================

model:
  # Path to the pre-trained YOLO weights (e.g. yolov8n.pt, yolov8s.pt,
  # yolov11n.pt) or a path to a custom trained model (e.g. runs/train/exp/weights/best.pt).
  # If the file does not exist locally, ultralytics will auto-download it.
  # Updated to use the provided custom weights (relative to workspace)
  path: YOLO_tiled_model/yolo-segmentation-model/weights/best.pt
  # Minimum confidence to keep a detection (0.0 - 1.0)
  conf_threshold: 0.25
  # IoU threshold used by NMS (0.0 - 1.0)
  iou_threshold: 0.45
  # Inference image size (must be a multiple of 32)
  image_size: 640
  # Compute device: "cpu", "cuda", "0", "mps" or null for auto-detect
  device: null
  # Draw bounding boxes onto a copy of each image (saved to data/annotated)
  save_visualizations: true

input:
  # Folder where you drop the raw images to be auto-annotated
  images_dir: data/input
  # Accepted image extensions
  extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .webp
    - .tif
    - .tiff

output:
  # YOLO-format label files (.txt), one per image
  labels_dir: data/labels
  # Copies of the images that share a stem with the label files (upload pair)
  images_dir: data/images
  # Visualizations with drawn boxes (optional)
  annotated_dir: data/annotated
  # Logs and a manifest of what was processed/uploaded
  log_dir: data/log

roboflow:
  # Roboflow credentials.
  # Preferred: set the ROBOFLOW_API_KEY environment variable instead of pasting the key here.
  api_key: "G7TWUQc7mE0XpYJgp5XY"
  # Roboflow workspace ID (e.g. "my-workspace")
  workspace: "swayams-workspace-ef5rt"
  # Roboflow project ID (e.g. "my-project")
  project: "uamtec1"
  # Master toggle: set false to only annotate locally, or use --dry-run
  upload_enabled: true
  # Name of the batch shown in Roboflow (grouping for this run)
  batch_name: auto_annotated_5
  # Number of upload retries per image on failure
  num_retries: 3
  # Number of parallel upload workers (the "parallel" part of the pipeline)
  workers: 4
  # Skip images that contain zero detections (recommended: true)
  skip_empty: true
  # Overwrite existing images in Roboflow
  overwrite: false
